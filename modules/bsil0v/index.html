  /* ust-yuzen-ada — Kenardan kenara şerit değil, sayfanın üstünde süzülen bağımsız bir kapsül: içerik başlığın arkasından görünür, uygulama/iOS dili. */
  .modulex-ust-yuzen-ada { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }

  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */

  .modulex-ust-yuzen-ada :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-yuzen-ada img { display: block; max-width: 100%; }

  :where(.modulex-ust-yuzen-ada) img { height: auto; }

  .modulex-ust-yuzen-ada-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-yuzen-ada-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-ust-yuzen-ada-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }

  .modulex-ust-yuzen-ada-oge:hover, .modulex-ust-yuzen-ada-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-yuzen-ada-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-yuzen-ada-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-yuzen-ada-cta .material-symbols-outlined, .modulex-ust-yuzen-ada-tel .material-symbols-outlined, .modulex-ust-yuzen-ada-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-yuzen-ada-tel, .modulex-ust-yuzen-ada-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-yuzen-ada-tel:hover, .modulex-ust-yuzen-ada-posta:hover { color: --accentInk--; }
  .modulex-ust-yuzen-ada-dil:empty { display: none; }
  .modulex-ust-yuzen-ada-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-yuzen-ada-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-yuzen-ada-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-yuzen-ada--acik .modulex-ust-yuzen-ada-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-yuzen-ada--acik .modulex-ust-yuzen-ada-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-yuzen-ada--acik .modulex-ust-yuzen-ada-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-yuzen-ada-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-yuzen-ada-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-yuzen-ada-sol 0.3s ease both; }
  @keyframes modulex-ust-yuzen-ada-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-yuzen-ada-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-yuzen-ada--js .modulex-ust-yuzen-ada-nav, .modulex-ust-yuzen-ada--js .modulex-ust-yuzen-ada-genis { display: none; }
    .modulex-ust-yuzen-ada--js .modulex-ust-yuzen-ada-ac { display: inline-flex; }
    .modulex-ust-yuzen-ada-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-yuzen-ada-in 0.3s ease both; }
    .modulex-ust-yuzen-ada-pliste { display: grid; }
    .modulex-ust-yuzen-ada-pliste .modulex-ust-yuzen-ada-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-yuzen-ada-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-yuzen-ada-panel { display: none !important; }
  }
  @keyframes modulex-ust-yuzen-ada-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-yuzen-ada.modulex-ust-yuzen-ada { padding-block: 16px; background-color: transparent; }
  .modulex-ust-yuzen-ada-ic { position: relative; }
  .modulex-ust-yuzen-ada-ada { position: relative; display: flex; align-items: center; gap: 10px 20px; min-height: 64px; padding-block: 8px; padding-inline: 24px 8px; border: 1px solid --cizgi--; border-radius: 999px; background-color: --kartBg--; box-shadow: 0 22px 44px -30px color-mix(in srgb, --text-- 55%, transparent), 0 2px 8px -4px color-mix(in srgb, --text-- 22%, transparent); transition: box-shadow 0.35s ease, transform 0.35s ease; }
  .modulex-ust-yuzen-ada-ada:hover, .modulex-ust-yuzen-ada-ada:focus-within { transform: translateY(-2px); box-shadow: 0 30px 54px -30px color-mix(in srgb, --text-- 62%, transparent), 0 2px 8px -4px color-mix(in srgb, --text-- 22%, transparent); }
  .modulex-ust-yuzen-ada-ada > .modulex-ust-yuzen-ada-nav { display: flex; flex: 1 1 auto; justify-content: center; min-width: 0; }
  .modulex-ust-yuzen-ada-adaliste { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
  .modulex-ust-yuzen-ada-adaliste .modulex-ust-yuzen-ada-oge { padding-inline: 16px; border-radius: 999px; }
  .modulex-ust-yuzen-ada-adaliste .modulex-ust-yuzen-ada-oge:hover { background-color: color-mix(in srgb, --text-- 7%, transparent); color: --text--; }
  .modulex-ust-yuzen-ada-adaliste .modulex-ust-yuzen-ada-oge[aria-current="page"] { background-color: --bg--; color: --text--; box-shadow: inset 0 0 0 1px --cizgi--, 0 4px 10px -6px color-mix(in srgb, --text-- 45%, transparent); }
  .modulex-ust-yuzen-ada-ada > .modulex-ust-yuzen-ada-genis { display: flex; flex: none; align-items: center; gap: 10px; }
  .modulex-ust-yuzen-ada-ada .modulex-ust-yuzen-ada-cta { min-height: 48px; padding-inline: 22px; }
  .modulex-ust-yuzen-ada-ada .modulex-ust-yuzen-ada-ac { border-color: transparent; background-color: --bg--; }
  @media (max-width: 1024px) {
    .modulex-ust-yuzen-ada-ada { justify-content: space-between; border-radius: 26px; }
    .modulex-ust-yuzen-ada--js .modulex-ust-yuzen-ada-ada > .modulex-ust-yuzen-ada-nav, .modulex-ust-yuzen-ada--js .modulex-ust-yuzen-ada-ada > .modulex-ust-yuzen-ada-genis { display: none; }
    .modulex-ust-yuzen-ada:not(.modulex-ust-yuzen-ada--js) .modulex-ust-yuzen-ada-ada { flex-wrap: wrap; }
    .modulex-ust-yuzen-ada:not(.modulex-ust-yuzen-ada--js) .modulex-ust-yuzen-ada-ada > .modulex-ust-yuzen-ada-nav { order: 3; flex-basis: 100%; justify-content: flex-start; }
    .modulex-ust-yuzen-ada-panel { inset-block-start: calc(100% + 10px); border: 1px solid --cizgi--; border-radius: 26px; background-color: --kartBg--; }
    .modulex-ust-yuzen-ada-pliste .modulex-ust-yuzen-ada-oge { border-block-end-color: color-mix(in srgb, --text-- 8%, transparent); }
  }
  @media (max-width: 768px) {
    .modulex-ust-yuzen-ada.modulex-ust-yuzen-ada { padding-block: 10px; padding-inline: 10px; }
    .modulex-ust-yuzen-ada-ada { min-height: 58px; padding-inline: 16px 6px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-yuzen-ada :is(.modulex-ust-yuzen-ada-baslik, .modulex-ust-yuzen-ada-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-yuzen-ada-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-yuzen-ada { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-yuzen-ada *, .modulex-ust-yuzen-ada *::before, .modulex-ust-yuzen-ada *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-yuzen-ada";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
